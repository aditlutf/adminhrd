<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000652">
<meta name="robots" content="noindex,nofollow">
<title>Admin Absensi Magang | Shelter</title>
<link rel="icon" type="image/svg+xml" href="https://hrdcentral.cloud/absenmaganghub/ikon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="https://hrdcentral.cloud/absenmaganghub/favicon-32.png">
<link rel="apple-touch-icon" href="https://hrdcentral.cloud/absenmaganghub/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="/absenmaganghub/config.js"></script>
<style>
:root{
  --navy:#000652; --navy-2:#121240; --biru:#3535DE; --biru-2:#2C2CC9; --cyan:#01B7FF;
  --teks:#1F2030; --teks-2:#5B5D6B; --garis:#E3E5EE; --latar:#F3F4F8; --tint:#F0F1FF;
  --hijau:#0F7B3E; --hijau-bg:#E5F4EB; --kuning:#8A5300; --kuning-bg:#FFF2D9; --merah:#B42318; --merah-bg:#FDECEA;
  --abu:#5B5F6E; --abu-bg:#EEF0F4;
  --r-sm:8px; --r:12px; --r-lg:16px;
  --bayang:0 1px 2px rgba(18,18,64,.06),0 4px 16px rgba(18,18,64,.05);
  --judul:'Heebo',system-ui,sans-serif; --isi:'Montserrat',system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--isi);font-size:14px;line-height:1.5;color:var(--teks);background:var(--latar);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--judul);margin:0;line-height:1.25;color:var(--navy-2)}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
a{color:var(--biru)}
.ik{width:18px;height:18px;flex:none}
.ik.kecil{width:15px;height:15px}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}

/* Login */
.masuk{min-height:100vh;display:grid;grid-template-columns:1fr}
.masuk-kiri{background:var(--navy);color:#fff;padding:32px 28px;position:relative;display:flex;flex-direction:column;justify-content:space-between}
.masuk-kiri::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--cyan)}
.masuk-kiri img{height:20px;display:block}
.masuk-kiri h1{color:#fff;font-size:30px;margin:40px 0 8px;letter-spacing:-.01em}
.masuk-kiri p{color:#C9CCF2;margin:0;max-width:420px}
.masuk-kanan{display:flex;align-items:center;justify-content:center;padding:32px 20px}
.masuk-form{width:100%;max-width:380px}
.masuk-form h2{font-size:22px;margin-bottom:4px}
.masuk-form .sub{color:var(--teks-2);margin:0 0 20px}
@media (min-width:900px){.masuk{grid-template-columns:5fr 6fr}.masuk-kiri{padding:48px}.masuk-kiri h1{font-size:40px;margin-top:0}}

/* Form */
.field{margin-bottom:14px}
.field label,.label{display:block;font-weight:600;font-size:13px;margin-bottom:6px;color:var(--navy-2)}
.input{width:100%;min-height:44px;border:1.5px solid #CDD0DE;border-radius:var(--r-sm);padding:9px 12px;background:#fff;font-size:15px}
.input:focus{border-color:var(--biru);outline:none;box-shadow:0 0 0 3px rgba(53,53,222,.15)}
textarea.input{resize:vertical;min-height:90px}
.bantu{font-size:12.5px;color:var(--teks-2);margin:5px 0 0}
.galat{background:var(--merah-bg);color:var(--merah);border-radius:var(--r-sm);padding:10px 12px;margin:0 0 14px;display:flex;gap:8px;align-items:flex-start}

/* Tombol */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 16px;border-radius:var(--r-sm);border:1.5px solid transparent;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;transition:background-color .15s,border-color .15s;text-decoration:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.utama{background:var(--navy);color:#fff}
.btn.utama:hover:not(:disabled){background:var(--navy-2)}
.btn.biru{background:var(--biru);color:#fff}
.btn.biru:hover:not(:disabled){background:var(--biru-2)}
.btn.garis{background:#fff;border-color:#CDD0DE;color:var(--navy)}
.btn.garis:hover:not(:disabled){border-color:var(--navy)}
.btn.hijau{background:var(--hijau);color:#fff}
.btn.bahaya{background:#fff;border-color:#F1B8B2;color:var(--merah)}
.btn.kecil{min-height:36px;padding:0 10px;font-size:13px}
.btn.penuh{width:100%}
.ikon-btn{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border:0;background:transparent;border-radius:var(--r-sm);cursor:pointer;color:var(--teks-2)}
.ikon-btn:hover{background:var(--abu-bg);color:var(--navy)}

/* Kerangka */
.shell{display:grid;grid-template-columns:1fr;min-height:100vh}
.samping{background:var(--navy);color:#fff;position:fixed;inset:0 auto 0 0;width:256px;z-index:50;display:flex;flex-direction:column;transform:translateX(-100%);transition:transform .2s ease-out}
.samping.buka{transform:none}
.samping-logo{padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,.1)}
.samping-logo img{height:18px;display:block}
.samping-logo span{display:block;font-size:12px;color:#C9CCF2;margin-top:8px}
.menu{flex:1;overflow-y:auto;padding:12px 10px}
.menu-kelompok{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8E91C9;padding:14px 12px 6px;font-weight:600}
.menu button{width:100%;display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border:0;border-radius:var(--r-sm);background:transparent;color:#DADCF7;font-weight:500;font-size:14px;cursor:pointer;text-align:left;position:relative}
.menu button:hover{background:rgba(255,255,255,.07);color:#fff}
.menu button[aria-current="page"]{background:rgba(1,183,255,.14);color:#fff;font-weight:600}
.menu button[aria-current="page"]::before{content:"";position:absolute;left:-10px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--cyan)}
.menu .lencana{margin-left:auto;background:var(--cyan);color:var(--navy);font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px}
.samping-akun{padding:14px 16px;border-top:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--biru);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--judul);font-weight:700;flex:none}
.samping-akun b{display:block;font-size:13px;color:#fff}
.samping-akun small{color:#C9CCF2;font-size:12px}
.samping-akun .ikon-btn{margin-left:auto;color:#C9CCF2}
.samping-akun .ikon-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.tirai{position:fixed;inset:0;background:rgba(7,8,42,.45);z-index:40}
.isi{min-width:0}
.atas{position:sticky;top:0;z-index:30;background:rgba(243,244,248,.92);backdrop-filter:blur(8px);display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--garis)}
.atas h1{font-size:19px}
.atas p{margin:1px 0 0;color:var(--teks-2);font-size:13px}
.atas .kanan{margin-left:auto;display:flex;gap:8px;align-items:center}
.konten{padding:16px;max-width:1400px}
@media (min-width:1024px){
  .shell{grid-template-columns:256px 1fr}
  .samping{transform:none;position:sticky;top:0;height:100vh}
  #btnMenu,.tirai{display:none!important}
  .atas{padding:16px 28px}
  .konten{padding:24px 28px}
}

/* Kartu & statistik */
.kartu{background:#fff;border:1px solid var(--garis);border-radius:var(--r-lg);padding:18px;margin-bottom:16px;box-shadow:var(--bayang)}
.kartu-kepala{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap}
.kartu-kepala h2{font-size:16px}
.kartu-kepala p{margin:2px 0 0;color:var(--teks-2);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(116px,1fr));gap:12px;margin-bottom:16px}
td a{white-space:nowrap;display:inline-flex;align-items:center;gap:3px}
.stat{background:#fff;border:1px solid var(--garis);border-radius:var(--r);padding:14px 16px;box-shadow:var(--bayang);text-align:left;cursor:default}
button.stat{cursor:pointer;font:inherit}
button.stat:hover{border-color:var(--biru)}
button.stat[aria-pressed="true"]{border-color:var(--biru);box-shadow:0 0 0 2px rgba(53,53,222,.2)}
.stat .lbl{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--teks-2)}
.stat b{display:block;font-family:var(--judul);font-size:28px;color:var(--navy-2);font-variant-numeric:tabular-nums;line-height:1.2;margin-top:4px}
.titik{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--abu)}
.titik.ok{background:var(--hijau)}.titik.warn{background:#D98A00}.titik.bad{background:var(--merah)}.titik.info{background:var(--biru)}
.alat{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.alat .field{margin:0}
.alat .input{min-height:40px}
.alat .btn{min-height:40px}
.grup-tgl{display:flex;align-items:center;gap:4px}
.cari{position:relative;min-width:220px;flex:1;max-width:340px}
.cari .ik{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--teks-2)}
.cari .input{padding-left:36px}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--abu-bg);color:var(--abu);white-space:nowrap}
.chip.ok{background:var(--hijau-bg);color:var(--hijau)}
.chip.warn{background:var(--kuning-bg);color:var(--kuning)}
.chip.bad{background:var(--merah-bg);color:var(--merah)}
.chip.info{background:var(--tint);color:var(--biru)}
.saring{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.saring button{min-height:36px;padding:0 12px;border-radius:999px;border:1.5px solid var(--garis);background:#fff;font-weight:600;font-size:13px;color:var(--teks-2);cursor:pointer}
.saring button[aria-pressed="true"]{border-color:var(--navy);background:var(--navy);color:#fff}
.segmen{display:inline-flex;background:var(--abu-bg);border-radius:var(--r-sm);padding:3px;gap:3px}
.segmen button{min-height:34px;padding:0 14px;border:0;border-radius:6px;background:transparent;font-weight:600;font-size:13px;color:var(--teks-2);cursor:pointer}
.segmen button[aria-pressed="true"]{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* Tabel */
.tabel-wrap{overflow-x:auto;border:1px solid var(--garis);border-radius:var(--r);background:#fff}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{background:#F7F8FB;text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--teks-2);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--garis);white-space:nowrap;position:sticky;top:0}
td{padding:11px 12px;border-bottom:1px solid var(--garis);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#FAFBFE}
td.angka,th.angka{text-align:right;font-variant-numeric:tabular-nums}
.nama b{display:block;color:var(--navy-2);font-weight:600}
.nama small{color:var(--teks-2)}
.jam{font-family:var(--judul);font-weight:600;font-size:16px;color:var(--navy-2);font-variant-numeric:tabular-nums}
.redup{color:var(--teks-2)}
.tanda{display:flex;flex-direction:column;gap:4px}
.tanda span{display:flex;gap:5px;align-items:flex-start;font-size:12px;color:var(--kuning);background:var(--kuning-bg);border-radius:6px;padding:3px 7px}
.foto-btns{display:flex;gap:6px;flex-wrap:wrap}
tr.detail td{background:#FAFBFE;padding:4px 12px 14px 12px}
tr.detail ol{margin:6px 0 0;padding-left:20px}
tr.detail li{margin-bottom:3px}
.kosong{text-align:center;color:var(--teks-2);padding:28px 12px}
@media (max-width:760px){
  table.resp thead{display:none}
  table.resp,table.resp tbody,table.resp tr,table.resp td{display:block;width:100%}
  table.resp tr{border-bottom:1px solid var(--garis);padding:10px 4px}
  table.resp td{border:0;padding:5px 10px;display:grid;grid-template-columns:96px 1fr;gap:8px}
  table.resp td::before{content:attr(data-l);font-size:11px;font-weight:600;color:var(--teks-2);text-transform:uppercase;letter-spacing:.04em;padding-top:2px}
  table.resp td.penuh{grid-template-columns:1fr}
  table.resp td.penuh::before{display:none}
  table.resp tr.detail td{grid-template-columns:1fr}
  table.resp td{justify-items:start;align-items:start}
  table.resp td.ksg{display:none}
  .stats{grid-template-columns:repeat(3,1fr);gap:8px}
  .stat{padding:10px 12px}
  .stat b{font-size:22px}
  .stat .lbl{font-size:11.5px}
}
td.nama{min-width:170px}
.stat-sub{display:block;font-size:11.5px;color:var(--teks-2);margin-top:2px}
.lok{margin-bottom:6px}
.lok small{display:block;color:var(--teks-2);font-size:12px;line-height:1.35;max-width:240px;white-space:normal}
.lb-alamat{flex-basis:100%;color:var(--teks)}
.panas{display:grid;grid-template-columns:34px repeat(24,minmax(10px,1fr));gap:2px;align-items:center}
.panas-jam{font-size:10px;color:var(--teks-2);text-align:left}
.panas-hari{font-size:11px;font-weight:600;color:var(--teks-2)}
.panas-sel{aspect-ratio:1/1;border-radius:3px;min-height:10px}
.panas-kaki{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--teks-2);margin-top:12px}
.panas-legenda{display:inline-flex;align-items:center;gap:3px}
.panas-legenda i{width:14px;height:14px;border-radius:3px;display:inline-block}
tr.bisa-buka{cursor:pointer}
tr.bisa-buka:focus-visible{outline:3px solid var(--cyan);outline-offset:-3px}
tr.bisa-buka[aria-expanded="true"] td{background:var(--tint)}
.garis-waktu{list-style:none;margin:8px 0 0;padding:0 0 0 4px;border-left:2px solid var(--garis)}
.garis-waktu li{display:grid;grid-template-columns:70px 1fr;gap:10px;padding:6px 0 6px 12px;position:relative;font-size:13px}
.garis-waktu li::before{content:"";position:absolute;left:-6px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--biru);border:2px solid #fff}
.garis-waktu time{font-variant-numeric:tabular-nums;color:var(--teks-2);font-weight:600}
.garis-waktu small{display:block;color:var(--teks-2);margin-top:2px}
.gw-jenis{font-weight:600;color:var(--navy-2)}

/* Matriks rekap */
.matriks{border-collapse:separate;border-spacing:0}
.matriks th,.matriks td{padding:0;text-align:center;border-bottom:1px solid var(--garis);border-right:1px solid #F0F1F6}
.matriks th{padding:6px 0;min-width:30px;font-size:10.5px;letter-spacing:0;line-height:1.2}
.matriks th.libur{color:#A3A6B8;background:#F1F2F6}
.matriks .kolnama{position:sticky;left:0;z-index:2;background:#fff;text-align:left;padding:6px 12px;min-width:170px;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;border-right:1px solid var(--garis)}
.matriks thead .kolnama{background:#F7F8FB;z-index:3}
.sel{display:flex;align-items:center;justify-content:center;width:26px;height:26px;margin:3px auto;border-radius:6px;font-size:11px;font-weight:700}
.sel.H{background:var(--hijau-bg);color:var(--hijau)}
.sel.T{background:var(--kuning-bg);color:var(--kuning)}
.sel.I,.sel.S{background:var(--tint);color:var(--biru)}
.sel.A{background:var(--merah-bg);color:var(--merah)}
.sel.L{background:#F3F4F7;color:#B0B3C2}
.sel.B{border:1.5px dashed #D98A00;color:var(--kuning)}
.legenda{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--teks-2);margin-top:12px}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.legenda .sel{margin:0;width:20px;height:20px;font-size:10px}

/* Lightbox foto */
.lb{position:fixed;inset:0;z-index:90;background:rgba(7,8,42,.82);display:flex;align-items:center;justify-content:center;padding:16px}
.lb-kotak{background:#fff;border-radius:var(--r-lg);width:100%;max-width:520px;max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.lb-atas{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 18px;border-bottom:1px solid var(--garis)}
.lb-atas strong{display:block;font-family:var(--judul);font-size:16px;color:var(--navy-2)}
.lb-atas span{font-size:13px;color:var(--teks-2)}
.lb-atas .ikon-btn{margin-left:4px}
.lb-atas > div{margin-right:auto}
.chip.hd{background:var(--navy);color:#fff}
.sel-pin{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pin-tampil{font-family:ui-monospace,Consolas,monospace;font-size:16px;font-weight:700;letter-spacing:.25em;color:var(--navy);background:var(--tint);border-radius:6px;padding:4px 8px}
.tanda-hd{font-size:10px;font-weight:700;background:var(--navy);color:#fff;border-radius:4px;padding:1px 4px;margin-left:4px}
.lb-foto{background:#0B0C2E;flex:1;min-height:240px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.lb-foto img{max-width:100%;max-height:68vh;display:block;-webkit-user-drag:none;user-select:none}
.lb-info{padding:12px 18px;font-size:13px;color:var(--teks-2);display:flex;gap:14px;flex-wrap:wrap;align-items:center}

/* Modal, toast, sibuk */
.lapisan{position:fixed;inset:0;z-index:80;background:rgba(7,8,42,.5);display:flex;align-items:center;justify-content:center;padding:16px}
.dialog{background:#fff;border-radius:var(--r-lg);width:100%;max-width:520px;max-height:calc(100vh - 32px);overflow-y:auto;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.dialog h2{font-size:18px;margin-bottom:6px}
.dialog .sub{color:var(--teks-2);margin:0 0 16px}
.dialog .aksi{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.dua{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toast{position:fixed;right:20px;bottom:20px;z-index:95;max-width:min(92vw,440px);background:var(--navy-2);color:#fff;padding:12px 16px;border-radius:var(--r);box-shadow:0 8px 24px rgba(0,0,0,.2);display:flex;gap:8px;align-items:flex-start}
.toast.galat{background:var(--merah)}
.toast.ok{background:var(--hijau)}
.spin{width:32px;height:32px;border-radius:50%;border:4px solid #D6D8F5;border-top-color:var(--biru);animation:putar .8s linear infinite}
.lb-foto .spin{position:absolute;border-color:rgba(255,255,255,.25);border-top-color:#fff}
@keyframes putar{to{transform:rotate(360deg)}}
.muat{display:flex;align-items:center;justify-content:center;gap:12px;padding:40px;color:var(--teks-2);font-weight:600}
.pre{white-space:pre-wrap;background:#F7F8FB;border:1px solid var(--garis);border-radius:var(--r-sm);padding:12px;font-size:13px;max-height:340px;overflow:auto;margin:0;font-family:var(--isi)}
.status-baris{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.status-baris > div{border:1px solid var(--garis);border-radius:var(--r);padding:12px 14px}
.status-baris small{display:block;color:var(--teks-2);font-weight:600;font-size:12px;margin-bottom:4px}
.hari-pilih{display:flex;gap:6px;flex-wrap:wrap}
.hari-pilih label{display:inline-flex;align-items:center;justify-content:center;min-width:52px;min-height:40px;border:1.5px solid var(--garis);border-radius:var(--r-sm);cursor:pointer;font-weight:600;font-size:13px;color:var(--teks-2);user-select:none}
.hari-pilih input{position:absolute;opacity:0;pointer-events:none}
.hari-pilih input:checked + span{color:#fff}
.hari-pilih label:has(input:checked){background:var(--navy);border-color:var(--navy);color:#fff}
.hari-pilih input:focus-visible + span{outline:3px solid var(--cyan);outline-offset:4px}
.saklar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--garis)}
.saklar:first-of-type{border-top:0}
.saklar b{display:block;font-size:14px;color:var(--navy-2)}
.saklar small{color:var(--teks-2);font-size:12.5px}
.saklar input{appearance:none;-webkit-appearance:none;width:46px;height:26px;border-radius:999px;background:#CDD0DE;position:relative;cursor:pointer;flex:none;transition:background .15s;margin:0}
.saklar input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.saklar input:checked{background:var(--biru)}
.saklar input:checked::after{transform:translateX(20px)}
.grid-set{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-items:start}
.simpan-bar{position:sticky;bottom:0;background:rgba(243,244,248,.95);backdrop-filter:blur(6px);padding:12px 0;display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--garis);margin-top:8px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

      '<span class="chip ' + (r.anomali.length ? 'warn' : 'ok') + '">' + (r.anomali.length ? r.anomali.length + ' tanda' : 'Tidak ada') + '</span></div>' +
      (r.anomali.length ? '<div class="tabel-wrap"><table class="resp"><thead><tr><th>Waktu</th><th>Akun</th><th>Tanda</th><th>Keterangan</th></tr></thead><tbody>' + r.anomali.map(function (x) {
        var t2 = TK[x.tingkat] || ['Info', 'info'];
        return '<tr><td data-l="Waktu">' + esc(waktuPendek(x.waktu)) + '</td><td data-l="Akun">' + esc(x.akun) + '</td><td data-l="Tanda"><span class="chip ' + t2[1] + '">' + esc(x.jenis) + '</span></td><td data-l="Keterangan">' + esc(x.detail) + '</td></tr>';
      }).join('') + '</tbody></table></div>' : '<p class="redup" style="margin:0">Tidak ada pola yang perlu diperhatikan pada rentang ini.</p>') + '</div>';
  }

  h += '<div class="grid-set">';
  h += '<div class="kartu"><div class="kartu-kepala"><div><h2>Pola waktu akses</h2><p>Jumlah aksi per hari dan jam (WIB).</p></div></div>' + heatmapHtml(r.heat) + '</div>';
  h += '<div class="kartu"><div class="kartu-kepala"><div><h2>Waktu per halaman</h2><p>Lama halaman terbuka, termasuk saat diam.</p></div></div><div class="tabel-wrap"><table><thead><tr><th>Halaman</th><th class="angka">Kunjungan</th><th class="angka">Total</th><th class="angka">Rata-rata</th></tr></thead><tbody>' +
    (r.halaman.length ? r.halaman.map(function (x) {
      return '<tr><td>' + esc(NAMA_HAL[x.halaman] || x.halaman) + '</td><td class="angka">' + x.kunjungan + '</td><td class="angka">' + durasiDetik(x.detik) + '</td><td class="angka">' + durasiDetik(Math.round(x.detik / Math.max(x.kunjungan, 1))) + '</td></tr>';
    }).join('') : '<tr><td colspan="4" class="kosong">Belum ada data.</td></tr>') + '</tbody></table></div></div>';
  h += '</div>';

  h += '<div class="kartu"><div class="kartu-kepala"><div><h2>Sesi login & timeline</h2><p>Tekan baris untuk melihat urutan aksi di sesi itu. Aktif = ada gerakan dalam 60 detik terakhir; diam = tab terbuka tanpa gerakan.</p></div></div><div class="tabel-wrap"><table class="resp"><thead><tr>' +
    '<th>Akun</th><th>Masuk</th><th>Terakhir</th><th class="angka">Durasi</th><th class="angka">Aktif</th><th class="angka">Diam</th><th class="angka">Tab lain</th><th>Perangkat</th><th>Status</th></tr></thead><tbody>' +
    (r.sesi.length ? r.sesi.map(function (x, i) {

        '<td data-l="Durasi" class="angka">' + (gagal ? '-' : durasiMenit(x.menit)) + '</td><td data-l="Aktif" class="angka">' + (gagal ? '-' : durasiDetik(x.aktif)) + '</td>' +
        '<td data-l="Diam" class="angka">' + (gagal ? '-' : durasiDetik(x.idle)) + '</td><td data-l="Tab lain" class="angka">' + (gagal ? '-' : durasiDetik(x.sembunyi)) + '</td>' +
        '<td data-l="Perangkat"><small>' + esc(x.perangkat) + (x.layar ? '<br>Layar ' + esc(x.layar) : '') + (x.zona ? ' \u00b7 ' + esc(x.zona) : '') + '</small>' + (x.perangkatBaru ? ' <span class="chip info">Perangkat baru</span>' : '') + '</td>' +
        '<td data-l="Status">' + st + '</td></tr>' + (gagal ? '' : '<tr class="detail" id="tl' + i + '" hidden><td colspan="9"></td></tr>');
    }).join('') : '<tr><td colspan="9" class="kosong penuh">Belum ada login pada rentang ini.</td></tr>') + '</tbody></table></div></div>';

  h += '<div class="kartu"><div class="kartu-kepala"><div><h2>Data peserta yang dilihat</h2><p>Gabungan foto, daftar kegiatan, dan peta lokasi yang dibuka per peserta.</p></div></div><div class="tabel-wrap"><table class="resp"><thead><tr>' +
    '<th>Peserta</th><th class="angka">Foto dibuka</th><th class="angka">Foto berbeda</th><th class="angka">Lama lihat foto</th><th class="angka">Kegiatan dibuka</th><th class="angka">Peta dibuka</th><th>Terakhir</th></tr></thead><tbody>' +
    (r.perPeserta.length ? r.perPeserta.map(function (x) {
      return '<tr><td data-l="Peserta" class="nama"><b>' + esc(x.nama || x.id) + '</b><small>' + esc(x.id) + '</small></td><td data-l="Foto dibuka" class="angka"><b>' + x.kali + '</b></td>' +
        '<td data-l="Foto berbeda" class="angka">' + x.fotoUnik + '</td><td data-l="Lama lihat" class="angka">' + durasiDetik(x.detik) + (x.kali ? ' <small class="redup">(rata ' + durasiDetik(x.rata) + ')</small>' : '') + '</td>' +
        '<td data-l="Kegiatan dibuka" class="angka">' + x.kegiatan + '</td><td data-l="Peta dibuka" class="angka">' + x.peta + '</td><td data-l="Terakhir">' + esc(waktuPendek(x.terakhir)) + '</td></tr>';
    }).join('') : '<tr><td colspan="7" class="kosong penuh">Belum ada data peserta yang dilihat.</td></tr>') + '</tbody></table></div></div>';

  var daftarKecil = function (judul, ket, arr, isi) {
    return '<div class="kartu"><div class="kartu-kepala"><div><h2>' + judul + '</h2><p>' + ket + '</p></div></div>' + (arr.length ? '<div class="tabel-wrap"><table><tbody>' + arr.map(isi).join('') + '</tbody></table></div>' : '<p class="redup" style="margin:0">Belum ada.</p>') + '</div>';
  };
  h += '<div class="grid-set">' +
    daftarKecil('Pencarian', 'Kata yang diketik di kotak cari.', r.pencarian, function (e) { return '<tr><td style="width:150px"><small>' + esc(waktuPendek(e.waktu)) + '</small></td><td>' + esc(e.akun) + '</td><td><b>' + esc(e.detail) + '</b> <small class="redup">' + esc(NAMA_HAL[e.halaman] || '') + '</small></td></tr>'; }) +
    daftarKecil('Unduhan data', 'File CSV yang diunduh dari panel.', r.unduhan, function (e) { return '<tr><td style="width:150px"><small>' + esc(waktuPendek(e.waktu)) + '</small></td><td>' + esc(e.akun) + '</td><td>' + esc(e.detail) + '</td></tr>'; }) +
    '</div>';
  if (r.perubahan.length) h += daftarKecil('Perubahan data', 'Aksi yang mengubah data atau pengaturan.', r.perubahan, function (e) {
    return '<tr><td style="width:150px"><small>' + esc(waktuPendek(e.waktu)) + '</small></td><td>' + esc(e.akun) + '</td><td><span class="chip">' + esc(labelJenis(e.jenis)) + '</span> ' + (e.nama ? '<b>' + esc(e.nama) + '</b> ' : '') + '<small>' + esc(e.detail) + '</small></td></tr>';
  });
  h += '<div class="kartu"><div class="kartu-kepala"><div><h2>Detail foto dibuka</h2><p>' + r.foto.length + ' catatan terbaru</p></div></div><div class="tabel-wrap"><table class="resp"><thead><tr>' +
    '<th>Waktu</th><th>Akun</th><th>Peserta</th><th>Foto</th><th class="angka">Durasi</th></tr></thead><tbody>' +
    (r.foto.length ? r.foto.map(function (x) {
      return '<tr><td data-l="Waktu">' + esc(waktuPendek(x.waktu)) + '</td><td data-l="Akun">' + esc(x.akun) + '</td><td data-l="Peserta">' + esc(x.nama) + '</td>' +
        '<td data-l="Foto">' + (x.jenis === 'MASUK' ? 'Clock in' : 'Clock out') + ' ' + esc(tglPendek(x.tanggal)) + '</td><td data-l="Durasi" class="angka">' + durasiDetik(x.detik) + '</td></tr>';
    }).join('') : '<tr><td colspan="5" class="kosong penuh">Belum ada.</td></tr>') + '</tbody></table></div></div>';
  $('auIsi').innerHTML = h;
  $$('[data-sesi]').forEach(function (tr) {
    var buka = function () {
      var i = +tr.getAttribute('data-sesi'), d = $('tl' + i), o = d.hidden;
      if (o && !d.firstChild.innerHTML) d.firstChild.innerHTML = timelineHtml(r.sesi[i], r);
      d.hidden = !o;
      tr.setAttribute('aria-expanded', o);
    };
    tr.onclick = buka;
    tr.onkeydown = function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); buka(); } };
  });
}
var SET_GRUP = [
  { j: 'Identitas', f: [['NAMA_PERUSAHAAN', 'Nama perusahaan', 'teks'], ['NAMA_PROGRAM', 'Nama program', 'teks'], ['LINK_ABSEN', 'Link absen untuk pesan WA', 'teks']] },
  { j: 'Jam kerja', f: [['JAM_MASUK', 'Jam masuk', 'jam'], ['TOLERANSI_MENIT', 'Toleransi terlambat (menit)', 'angka'], ['JAM_PULANG', 'Jam pulang', 'jam'], ['HARI_KERJA', 'Hari kerja', 'hari'],
    ['WAJIB_KEGIATAN_SAAT_PULANG', 'Wajib isi kegiatan sebelum clock out', 'saklar', 'Peserta tidak bisa clock out sebelum mencatat minimal satu kegiatan hari itu.']] },
  { j: 'Lokasi', f: [['LOKASI_WAJIB', 'GPS wajib aktif saat absen', 'saklar', 'Absen ditolak bila izin lokasi atau GPS di HP peserta mati.'],
    ['BATASI_RADIUS', 'Tolak absen di luar radius kantor', 'saklar', 'Bila aktif, absen hanya bisa dari dalam radius kantor. Matikan bila peserta ditempatkan di beberapa lokasi.'],
    ['KANTOR_LAT', 'Latitude kantor', 'teks'], ['KANTOR_LNG', 'Longitude kantor', 'teks'], ['RADIUS_METER', 'Radius (meter)', 'angka']] },
  { j: 'WhatsApp (Fonnte)', f: [['WA_AKTIF', 'Aktifkan kirim WhatsApp', 'saklar', 'Saklar utama. Selama mati, tidak ada WA yang dikirim ke grup maupun pribadi, otomatis atau manual.'], ['FONNTE_TOKEN', 'Token Fonnte', 'rahasia'], ['FONNTE_TARGET', 'Target pengingat (ID grup atau nomor)', 'teks'], ['PENGINGAT_MASUK', 'Jam pengingat belum clock in', 'teks'],
    ['PENGINGAT_PULANG', 'Jam pengingat belum clock out', 'teks'], ['REKAP_HARIAN', 'Jam rekap harian', 'teks'], ['REKAP_TARGET', 'Penerima rekap (kosong = sama dengan target)', 'teks'],
    ['PENGINGAT_PRIBADI', 'Juga kirim WA pribadi ke tiap peserta', 'saklar', 'Selain ke grup, kirim ke nomor tiap peserta yang belum lengkap dengan jeda acak 4-9 detik. Lebih efektif, tetapi menambah risiko nomor Fonnte diblokir WhatsApp.'],
    ['KIRIM_JIKA_LENGKAP', 'Tetap kirim walau semua sudah lengkap', 'saklar', 'Bila mati, jadwal pengingat dilewati saat semua peserta sudah lengkap (lebih hemat dan tidak mengganggu).']] }
];
function halPengaturan() {
  $('konten').innerHTML = memuat();
  api('pengaturan').then(function (r) { A.set = r; renderPengaturan(); }).catch(function (e) { $('konten').innerHTML = galatKartu(e.message); });
}
function renderPengaturan() {
  var r = A.set, nilai = {}, ket = {};
  r.nilai.forEach(function (x) { nilai[x.kunci] = x.nilai; ket[x.kunci] = x.ket; });
  var medan = function (f) {
    var k = f[0], v = nilai[k] == null ? '' : String(nilai[k]), id = 'set_' + k;
    if (f[2] === 'saklar') return '<label class="saklar" for="' + id + '"><span><b>' + esc(f[1]) + '</b><small>' + esc(f[3] || ket[k]) + '</small></span><input type="checkbox" id="' + id + '" data-k="' + k + '"' + (v === 'YA' ? ' checked' : '') + '></label>';
    if (f[2] === 'hari') {
      var pilih = v.split(',');
      return '<div class="field"><span class="label">' + esc(f[1]) + '</span><div class="hari-pilih" data-k="' + k + '">' + [1, 2, 3, 4, 5, 6, 7].map(function (n) {
        return '<label><input type="checkbox" value="' + n + '"' + (pilih.indexOf(String(n)) !== -1 ? ' checked' : '') + '><span>' + HARI_PENDEK[n] + '</span></label>';
      }).join('') + '</div></div>';
    }
    var tipe = f[2] === 'jam' ? 'time' : f[2] === 'angka' ? 'number' : f[2] === 'rahasia' ? 'password' : 'text';
    return '<div class="field"><label for="' + id + '">' + esc(f[1]) + '</label><input class="input" type="' + tipe + '" id="' + id + '" data-k="' + k + '" value="' + esc(v) + '"' +
      (f[2] === 'rahasia' ? ' placeholder="' + (r.tokenAda ? 'Tersimpan. Isi untuk mengganti.' : 'Tempel token dari dashboard Fonnte') + '" autocomplete="off"' : '') + '><p class="bantu">' + esc(ket[k]) + '</p></div>';
  };
  var h = '<div class="grid-set">';
  SET_GRUP.forEach(function (g) {
    h += '<div class="kartu"><div class="kartu-kepala"><h2>' + g.j + '</h2>' + (g.j === 'Lokasi' ? '<button class="btn garis kecil" id="setLokSaya">' + ik('pin', 'kecil') + 'Pakai lokasi saya</button>' : '') + '</div>' + g.f.map(medan).join('') + '</div>';
  });
  h += '<div class="kartu"><div class="kartu-kepala"><div><h2>Hari libur</h2><p>Tanggal merah / cuti bersama. Peserta tidak dihitung tidak hadir dan pengingat tidak dikirim.</p></div></div>' +
    '<div class="alat" style="margin-bottom:12px"><div class="field"><label for="lbTgl">Tanggal</label><input class="input" type="date" id="lbTgl"></div><div class="field" style="flex:1"><label for="lbKet">Keterangan</label><input class="input" id="lbKet" placeholder="Contoh: Hari Natal"></div>' +
    '<button class="btn garis" id="lbTambah">' + ik('tambah') + 'Tambah</button></div>' +
    (r.libur.length ? '<div class="tabel-wrap"><table><tbody>' + r.libur.map(function (x) {
      return '<tr><td style="width:150px">' + HARI_PENDEK[hariKe(x.tanggal)] + ', ' + tglPendek(x.tanggal) + '</td><td>' + esc(x.ket) + '</td><td style="width:52px"><button class="ikon-btn" data-hapuslibur="' + x.tanggal + '" aria-label="Hapus libur ' + x.tanggal + '">' + ik('hapus') + '</button></td></tr>';
    }).join('') + '</tbody></table></div>' : '<p class="redup">Belum ada hari libur.</p>') + '</div></div>';
  h += '<div class="simpan-bar"><button class="btn garis" id="setBatal">Batalkan perubahan</button><button class="btn utama" id="setSimpan">' + ik('centang') + 'Simpan pengaturan</button></div>';
  $('konten').innerHTML = h;
  $('setBatal').onclick = renderPengaturan;
  $('setLokSaya').onclick = function () {
    if (!navigator.geolocation) { toast('Browser tidak mendukung lokasi.', 'galat'); return; }
    var btn = this;
    btn.disabled = true;
    navigator.geolocation.getCurrentPosition(function (p) {
      btn.disabled = false;
      $('set_KANTOR_LAT').value = p.coords.latitude.toFixed(6);
      $('set_KANTOR_LNG').value = p.coords.longitude.toFixed(6);
      toast('Koordinat diisi (akurasi ' + Math.round(p.coords.accuracy) + ' m). Tekan Simpan.', 'ok');
    }, function () { btn.disabled = false; toast('Lokasi tidak didapat. Izinkan akses lokasi.', 'galat'); }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
  };
  $('set_KANTOR_LAT').addEventListener('change', function () {
    var m = this.value.match(/^\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*$/);
    if (m) { this.value = m[1]; $('set_KANTOR_LNG').value = m[2]; }
  });
  $('setSimpan').onclick = function () {
    var btn = this, data = {};
    $$('[data-k]').forEach(function (el) {
      var k = el.getAttribute('data-k');
      if (el.classList.contains('hari-pilih')) data[k] = $$('input:checked', el).map(function (c) { return c.value; }).join(',');
      else if (el.type === 'checkbox') data[k] = el.checked ? 'YA' : 'TIDAK';
      else data[k] = el.value;
    });
    btn.disabled = true;
    api('pengaturanSimpan', { nilai: data }).then(function (x) { A.set = x; renderPengaturan(); toast('Pengaturan tersimpan.', 'ok'); })
      .catch(function (e) { btn.disabled = false; toast(e.message, 'galat'); });
  };
  $('lbTambah').onclick = function () {
    if (!$('lbTgl').value) { toast('Pilih tanggal libur.', 'galat'); return; }
    api('liburSimpan', { tanggal: $('lbTgl').value, ket: $('lbKet').value }).then(function (x) { A.set = x; renderPengaturan(); toast('Hari libur ditambahkan.', 'ok'); }).catch(function (e) { toast(e.message, 'galat'); });
  };
  $$('[data-hapuslibur]').forEach(function (b) {
    b.onclick = function () { api('liburHapus', { tanggal: b.getAttribute('data-hapuslibur') }).then(function (x) { A.set = x; renderPengaturan(); }).catch(function (e) { toast(e.message, 'galat'); }); };
  });
}

function tampilMasuk() { $('layarMasuk').hidden = false; $('layarAdmin').hidden = true; setTimeout(function () { $('mUser').focus(); }, 50); }
$('fMasuk').addEventListener('submit', function (e) {
  e.preventDefault();
  var u = $('mUser').value.trim(), p = $('mPass').value, b = $('mBtn'), g = $('mGalat');
  if (!u || !p) { g.innerHTML = ik('awas') + '<span>Isi nama pengguna dan kata sandi.</span>'; g.hidden = false; return; }
  g.hidden = true;
  b.disabled = true; b.textContent = 'Memeriksa...';
  panggil('adminMasuk', [u, p, infoAlat()]).then(function (r) {
    b.disabled = false; b.textContent = 'Masuk';
    A.token = r.token;
    simpan.set('mg_admin_token', r.token);
    $('mPass').value = '';
    mulaiAplikasi();
  }).catch(function (err) {
    b.disabled = false; b.textContent = 'Masuk';
    g.innerHTML = ik('awas') + '<span>' + esc(bersihPesan(err.message)) + '</span>';
    g.hidden = false;
  });
});
function mulaiAplikasi() {
  $('layarMasuk').hidden = true;
  $('layarAdmin').hidden = false;
  $('konten').innerHTML = memuat();
  api('muat').then(function (r) {
    A.muat = r; A.akun = r.akun; A.offset = r.serverNow - Date.now();
    jkMulai();
    $('sNama').textContent = r.akun.nama || r.akun.u;
    $('sPeran').textContent = r.akun.peran === 'admin' ? 'Admin' : 'Branch Manager';
    $('sAvatar').textContent = inisial(r.akun.nama || r.akun.u);
    $('sProgram').textContent = r.program;
    buka(simpan.get('mg_admin_hal') || 'harian');
    if (isAdmin()) api('izin', { status: 'MENUNGGU' }).then(function (x) { A.menunggu = x.menunggu; renderMenu(); }).catch(function () { });
  }).catch(function (e) { if (A.token) $('konten').innerHTML = galatKartu(e.message); });
}
function keluar(diam) {
  if (!diam && A.token) { tutupHalaman(); kirimCatat(false); api('keluar', jkStat()).catch(function () { }); }
  if (JK.kunci) simpan.hapus(JK.kunci);
  JK.kunci = ''; JK.hal = ''; JK.antre = [];
  tutupFoto();
  A.token = ''; A.akun = null; A.muat = null;
  simpan.hapus('mg_admin_token');
  tampilMasuk();
}
$('btnKeluar').onclick = function () { konfirmasi('Keluar dari panel?', 'Anda perlu login lagi untuk membuka panel.', 'Keluar', 'bahaya').then(function (ya) { if (ya) keluar(false); }); };
setInterval(function () {
  if (!A.token || !A.akun || document.visibilityState !== 'visible') return;
  api('detak', jkStat()).then(function (r) {
    if (!r || !r.hariIni || !A.muat || r.hariIni === A.muat.hariIni) return;
    var lama = A.muat.hariIni;
    A.muat.hariIni = r.hariIni;
    if (A.tgl === lama) A.tgl = r.hariIni;
  }).catch(function () { });
}, 60000);
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  if (!$('lb').hidden) tutupFoto();
  else if (!$('lapisan').hidden) tutupDialog();
  else tutupMenu();
});
pasangIkon(document);
panggil('info', []).then(function (i) { $('mProgram').innerHTML = esc(i.program) + ' &middot; ' + esc(i.perusahaan); }).catch(function () { });
if (A.token) mulaiAplikasi(); else tampilMasuk();
</script>
